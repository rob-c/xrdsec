[build-system]
# Hatchling 1.32 emits Core Metadata 2.5, which Twine 6.2 cannot validate.
# Keep isolated and CI builds reproducible until the inspection tool catches up.
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "xrdsec"
dynamic = ["version"]
description = "Grid security and credentials shared by xrdclient, xgfalclient and xrdarc: X.509 and RFC 3820 proxies, delegation profiles, VOMS, bearer tokens, Kerberos, GSI, credential discovery and client TLS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Robert Currie", email = "robert.andrew.currie@gmail.com" }]
keywords = ["x509", "gsi", "proxy", "voms", "grid", "wlcg", "hep", "bearer-token", "tls"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
  # Ships py.typed: the package is checked with mypy --strict.
  "Typing :: Typed",
]
# Maintained libraries provide the parsing and the cryptography; this
# package decides only what grid peers expect of them.
dependencies = [
  "xrdcore>=0.4.1,<0.5",
  "asn1crypto>=1.5.1",
  "cryptography>=45",
]

[project.urls]
Homepage = "https://github.com/rob-c/xrdsec"
# The README is the documentation: the module table, the examples, the contracts.
Documentation = "https://github.com/rob-c/xrdsec#readme"
Repository = "https://github.com/rob-c/xrdsec"
Issues = "https://github.com/rob-c/xrdsec/issues"
Changelog = "https://github.com/rob-c/xrdsec/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# GSS-API Kerberos (xrdsec.krb5.gss) through the platform's own library;
# Linux source builds need Kerberos development headers and a C compiler.
# The pure-Python Kerberos client (xrdsec.krb5.client) needs none of it.
krb5 = ["gssapi>=1.12,<2"]
# The pytest plugin xrdsec.testing.fixtures, which a suite loads with
# pytest_plugins; nothing else of xrdsec needs pytest.
testing = ["pytest>=8"]
dev = [
  "build>=1,<2",
  # tests/test_scorecard.py: xrd-devtools' scorecard gate measures with these.
  "complexipy>=6,<7",
  "mypy>=2.3,<2.5",
  "pytest>=8",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "radon>=6,<7",
  "ruff>=0.5",
  "twine>=6,<7",
]

[tool.hatch.build.targets.wheel]
# The package alone (py.typed included); tests and tooling stay in the sdist.
packages = ["src/xrdsec"]

[tool.hatch.build.targets.sdist]
# An explicit list, so a local build never ships caches, coverage data,
# a built site or a virtual environment that happens to be lying around.
include = [
  "/src",
  "/tests",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/COPYING",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
]
exclude = ["__pycache__", "*.py[cod]"]

[tool.hatch.version]
path = "src/xrdsec/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes ``tests`` a namespace package: test modules import ``tests._pki``.
# The take-over gate (tests/test_scorecard.py) is xrd-devtools' pytest plugin,
# found in a sibling checkout or CI's .dependencies/ checkout (it cannot be a
# dependency: PyPI refuses direct-URL requirements); without one it skips.
pythonpath = [".", "src", "../xrdcore/src", "../xrd-devtools/src", ".dependencies/xrd-devtools/src"]
timeout = 120
addopts = "-ra"
# >>> xrddevtools sync: pytest-warnings (generated from xrd-devtools/src/xrddevtools/standard) >>>
# Every warning fails the run, ours and third parties' alike; a test that
# expects one says so with ``pytest.warns``.
filterwarnings = ["error"]
# <<< xrddevtools sync: pytest-warnings <<<

# Every line and branch: this is credential-handling code, so a gap means a
# refusal or a fallback that no test has ever seen happen.
# >>> xrddevtools sync: coverage (generated from xrd-devtools/src/xrddevtools/standard) >>>
[tool.coverage.run]
branch = true
source = ["xrdsec"]
parallel = true

[tool.coverage.report]
# Every line and branch, reached by a test that makes the case happen.
fail_under = 100
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
  "\\.\\.\\.$",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true
# <<< xrddevtools sync: coverage <<<

# >>> xrddevtools sync: ruff (generated from xrd-devtools/src/xrddevtools/standard) >>>
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF",
  # High-confidence security checks. The wider S family cannot tell the
  # protocol-mandated hashes, parsers and subprocesses of a storage client
  # from unsafe application code, so it is reviewed rather than enabled.
  "S102", "S307", "S506", "S602", "S608", "S609", "S701",
  # Banned APIs: the banned-api table.
  "TID251",
]
# No rule is ignored and there are no per-file ignores: old code passes the
# same checks as new code.
ignore = []
# <<< xrddevtools sync: ruff <<<

# What xrdsec owns it does not ban: TLS context construction (xrdsec.tls),
# http.client (voms_client and gsi.httpg speak HTTP without xrdhttp, which
# xrdsec may not import), and gssapi (xrdsec.krb5.gss is its one importer).
# CONTRIBUTING.md explains each entry.
# >>> xrddevtools sync: banned-api (generated from xrd-devtools/src/xrddevtools/standard) >>>
# What another part of the chain owns, this repository does not do itself:
# each message names the replacement. No entry is scoped by file and nothing
# is ignored; CONTRIBUTING.md's "Banned APIs" explains each one.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"urllib3".msg = "xrdsec takes no third-party HTTP stack: its few HTTPS calls (voms_client) use http.client with xrdsec.tls contexts"
"requests".msg = "xrdsec takes no third-party HTTP stack: its few HTTPS calls (voms_client) use http.client with xrdsec.tls contexts"
"httpx".msg = "xrdsec takes no third-party HTTP stack: its few HTTPS calls (voms_client) use http.client with xrdsec.tls contexts"
"urllib.request".msg = "urllib's opener has none of the chain's TLS rules: use http.client with an xrdsec.tls context, as voms_client does"
"krb5".msg = "pykrb5 is not a dependency: credential caches are xrdsec.krb5.caches / xrdsec.krb5.ccache, GSS-API is xrdsec.krb5.gss"
"botocore".msg = "S3 signing and the S3 codec are xrdhttp.s3 (the xrdhttp[s3] extra); only xrdhttp.s3 imports botocore"
"boto3".msg = "S3 signing and the S3 codec are xrdhttp.s3 (the xrdhttp[s3] extra); only xrdhttp.s3 imports botocore"
"concurrent.futures.ThreadPoolExecutor".msg = "a fan-out is xrdcore.fanout.run_all (first failure raised, the rest stopped); a long-lived pool is xrdcore.fanout.Pool"
"xml.etree.ElementTree.XML".msg = "parse XML with xrdcore.safexml.fromstring, which refuses DOCTYPEs and entities"
"xml.etree.ElementTree.XMLParser".msg = "parse XML with xrdcore.safexml.fromstring, which refuses DOCTYPEs and entities"
"xml.etree.ElementTree.XMLPullParser".msg = "parse XML with xrdcore.safexml.fromstring, which refuses DOCTYPEs and entities"
"xml.etree.ElementTree.fromstring".msg = "parse XML with xrdcore.safexml.fromstring, which refuses DOCTYPEs and entities"
"xml.etree.ElementTree.fromstringlist".msg = "parse XML with xrdcore.safexml.fromstring, which refuses DOCTYPEs and entities"
"xml.etree.ElementTree.iterparse".msg = "parse XML with xrdcore.safexml.fromstring, which refuses DOCTYPEs and entities"
"xml.etree.ElementTree.parse".msg = "parse XML with xrdcore.safexml.fromstring, which refuses DOCTYPEs and entities"
"xml.dom.minidom".msg = "parse XML with xrdcore.safexml.fromstring, which refuses DOCTYPEs and entities"
"xml.dom.pulldom".msg = "parse XML with xrdcore.safexml.fromstring, which refuses DOCTYPEs and entities"
"xml.parsers.expat".msg = "parse XML with xrdcore.safexml.fromstring, which refuses DOCTYPEs and entities"
"xml.sax.make_parser".msg = "parse XML with xrdcore.safexml.fromstring, which refuses DOCTYPEs and entities"
"xml.sax.parse".msg = "parse XML with xrdcore.safexml.fromstring, which refuses DOCTYPEs and entities"
"xml.sax.parseString".msg = "parse XML with xrdcore.safexml.fromstring, which refuses DOCTYPEs and entities"
"xrdhttp".msg = "xrdsec sits below xrdhttp in the chain and never imports it (dependency direction)"
"xrdclient".msg = "xrdsec sits below xrdclient in the chain and never imports it (dependency direction)"
"xgfalclient".msg = "xrdsec sits below xgfalclient in the chain and never imports it (dependency direction)"
"xrdarc".msg = "xrdsec sits below xrdarc in the chain and never imports it (dependency direction)"
"xrdwms".msg = "xrdsec sits below xrdwms in the chain and never imports it (dependency direction)"
# <<< xrddevtools sync: banned-api <<<

[tool.ruff.lint.isort]
known-first-party = ["xrdsec", "xrdcore"]
# Test modules import the suite's helpers as ``tests.<module>``: local, sorted last.
known-local-folder = ["tests"]

# >>> xrddevtools sync: mypy (generated from xrd-devtools/src/xrddevtools/standard) >>>
[tool.mypy]
# 3.11 is the oldest interpreter any supported platform hands a user.
python_version = "3.11"
strict = true
# <<< xrddevtools sync: mypy <<<
# Everything that is Python: the package and its tests (the release-artifact
# checks are xrd-devtools').
files = ["src", "tests"]
mypy_path = "src:../xrdcore/src"
# The tests directory is a namespace package to mypy, so one override names it.
explicit_package_bases = true

# >>> xrddevtools sync: mypy-overrides (generated from xrd-devtools/src/xrddevtools/standard) >>>
# Tests may leave a fixture-taking test function unannotated, but its body is
# still checked, so a type error (or an unused ignore) in a test fails too.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

# asn1crypto 1.5 ships neither inline types nor a stub package.
[[tool.mypy.overrides]]
module = ["asn1crypto.*"]
ignore_missing_imports = true

# python-gssapi (the krb5 extra) is typed (py.typed) when installed, but it is
# a native build that is absent wherever it cannot be built, such as a lint-
# only environment; installed, its own types are still checked.
[[tool.mypy.overrides]]
module = ["gssapi", "gssapi.*"]
ignore_missing_imports = true
# <<< xrddevtools sync: mypy-overrides <<<

# >>> xrddevtools sync: complexipy (generated from xrd-devtools/src/xrddevtools/standard) >>>
[tool.complexipy]
# Every function of every Python file, with no snapshot of old offenders.
paths = ["src", "tests"]
max-complexity-allowed = 15
failed = true
# <<< xrddevtools sync: complexipy <<<
